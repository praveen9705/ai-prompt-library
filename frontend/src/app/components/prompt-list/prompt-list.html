<div class="app">

  <!-- HEADER -->
  <div class="header">
    <h1>🔥 Explore</h1>
  </div>

  <!-- ADD BUTTON -->
  <button class="add-btn" (click)="showAdd = true">+ Add</button>

  <!-- GRID -->
  <div *ngIf="prompts && prompts.length > 0; else loading">

    <div class="grid">
      <div 
        class="card" 
        *ngFor="let p of prompts" 
        (click)="selectedPrompt = p">

        <div class="overlay">
          <h3>{{ p?.title || 'Untitled' }}</h3>
          <p>{{ p?.content || 'No content available' }}</p>
        </div>

      </div>
    </div>

  </div>

  <!-- LOADING / EMPTY -->
  <ng-template #loading>
    <div class="center">Loading prompts...</div>
  </ng-template>

  <!-- VIEW MODAL -->
  <div class="modal" *ngIf="selectedPrompt">

    <div class="modal-box card">

      <h2>{{ selectedPrompt?.title }}</h2>

      <p class="content">
        {{ selectedPrompt?.content }}
      </p>

      <p class="meta">
        👁 {{ selectedPrompt?.view_count || 0 }} views
      </p>

      <button 
        class="close-btn" 
        (click)="selectedPrompt = null">
        Close
      </button>

    </div>

  </div>

  <!-- ADD MODAL -->
  <div class="modal" *ngIf="showAdd">

    <div class="modal-box card">

      <h2>Add Prompt</h2>

      <input 
        type="text" 
        placeholder="Title"
        [(ngModel)]="newPrompt.title" />

      <textarea 
        placeholder="Content"
        [(ngModel)]="newPrompt.content">
      </textarea>

      <button 
        class="submit-btn" 
        (click)="addPrompt()">
        Submit
      </button>

      <button 
        class="close-btn" 
        (click)="showAdd = false">
        Cancel
      </button>

    </div>

  </div>

</div>
